name: Hello
on:
  push:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - run: echo "準備"
  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: package.json の名前を表示
        run: |
          cat package.json
          node -e "console.log(require('./package.json').name)"
  check:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - run: echo "チェック"